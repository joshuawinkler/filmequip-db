name: Add new item
description: Suggest a device to be added to the database
labels: ["new-item"]
body:
  - type: input
    id: name
    attributes:
      label: Name
      description: e.g. "Alexa Mini LF", or "7-inch Monitor" for a generic item
    validations:
      required: true
  - type: input
    id: manufacturer
    attributes:
      label: Manufacturer
      description: Leave blank for generic items with no specific manufacturer/model
    validations:
      required: false
  - type: input
    id: search_aliases
    attributes:
      label: Search aliases
      description: Alternate search terms, comma-separated, e.g. "A35, Alexa35"
    validations:
      required: false
  - type: dropdown
    id: category_root
    attributes:
      label: Top-level category
      options:
        - Camera
        - Grip
        - Lighting
        - Sound
        - Miscellaneous
    validations:
      required: true
  - type: input
    id: category_path
    attributes:
      label: Full category
      description: >
        The full category path, root to leaf, e.g. "Camera > Cameras > Digital
        Cameras". See data/categories.json in the repo for the full tree, or
        leave blank and a maintainer will place it.
    validations:
      required: false
  - type: textarea
    id: specs
    attributes:
      label: Technical specs
      description: Anything you know (sensor, mount, weight, power, etc.)
  - type: input
    id: source
    attributes:
      label: Link to datasheet / manufacturer page
    validations:
      required: true
