name: Neues Gerät hinzufügen
description: Schlage ein Gerät vor, das in die Datenbank aufgenommen werden soll
labels: ["new-item"]
body:
  - type: input
    id: manufacturer
    attributes:
      label: Hersteller
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Modell
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Kategorie
      options:
        - Digital Cameras
        - Film Cameras
        - LED
        - HMI
        - Tungsten
        - Andere (bitte im Feld unten angeben)
    validations:
      required: true
  - type: textarea
    id: specs
    attributes:
      label: Technische Daten
      description: Alles was du weißt (Sensor, Mount, Gewicht, Leistung, etc.)
  - type: input
    id: source
    attributes:
      label: Link zum Datenblatt / Herstellerseite
    validations:
      required: true
