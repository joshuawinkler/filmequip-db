<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filmequip DB – Admin – Miscellaneous</title>
  <style>
    :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
    }
    html, body {
      margin: 0;
      height: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .admin-nav {
      flex: 0 0 auto;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      font-size: 13px;
    }
    .admin-nav a {
      color: var(--text-dim);
      text-decoration: none;
      padding: 4px 10px;
      border-radius: 6px;
    }
    .admin-nav a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
    .admin-nav a.current { color: var(--accent); font-weight: 600; }
    .admin-nav .sep { color: var(--border); }
    /* Decap's own UI assumes it owns the full viewport height - since the nav
       bar above it takes up some of that, stretch #nc-root (and whatever
       Decap mounts inside it) to fill exactly what's left instead of Decap's
       shorter-than-viewport app leaving this page's background exposed. */
    #nc-root {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
    }
    #nc-root > * {
      flex: 1 1 auto;
      min-height: 0;
    }
  </style>
</head>
<body>
  <nav class="admin-nav">
    <a href="../">All categories</a>
    <span class="sep">/</span>
    <a href="../camera/" class="">Camera</a>
    <a href="../grip/" class="">Grip</a>
    <a href="../lighting/" class="">Lighting</a>
    <a href="../sound/" class="">Sound</a>
    <a href="../miscellaneous/" class="current">Miscellaneous</a>
  </nav>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
