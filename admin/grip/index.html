<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filmequip DB – Admin – Grip</title>
  <style>
    :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
    }
    html, body { margin: 0; height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }
    header {
      flex: 0 0 auto;
      padding: 14px 20px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; color: var(--text); }
    header nav a {
      color: var(--text-dim);
      text-decoration: none;
      font-size: 12px;
      margin-left: 12px;
    }
    header nav a:hover { color: var(--text); }
    header nav a.current { color: var(--accent); font-weight: 600; }
    #nc-root { flex: 1 1 auto; min-height: 0; display: flex; }
    #nc-root > * { flex: 1 1 auto; min-height: 0; }
  </style>
</head>
<body>
  <header>
    <h1>Grip</h1>
    <nav>
      <a href="../">All categories</a>
      <a href="../camera/" class="">Camera</a>
      <a href="../grip/" class="current">Grip</a>
      <a href="../lighting/" class="">Lighting</a>
      <a href="../sound/" class="">Sound</a>
      <a href="../miscellaneous/" class="">Miscellaneous</a>
      <a href="../../manage/">Structure manager</a>
    </nav>
  </header>
  <div id="nc-root"></div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
