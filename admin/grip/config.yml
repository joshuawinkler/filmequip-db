# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Auto-generated by scripts/import_categories.py from data/categories.json and
# data/schemas/fields/*.json - do not hand-edit the `collections:` section,
# re-run the import script instead (it takes the same source CSVs each time).

backend:
  name: github
  repo: joshuawinkler/filmequip-db
  branch: main
  base_url: https://decap-proxy.joshuawinkler.workers.dev
  auth_endpoint: auth

# Opens a PR for every change instead of writing directly to main.
# This preserves the CI validation + review requirement.
publish_mode: editorial_workflow

media_folder: "" # no image upload — images are only linked via image_url (see CONTRIBUTING.md)

collections:
- name: grip
  label: GRIP
  folder: data/grip
  create: true
  slug: '{{id}}'
  identifier_field: id
  extension: yaml
  format: yaml
  summary: '{{name}}'
  fields:
  - label: ID
    name: id
    widget: hidden
    required: false
    default: ''
  - label: Name
    name: name
    widget: string
  - label: Manufacturer
    name: manufacturer
    widget: string
    required: false
  - label: Generic Item
    name: generic
    widget: boolean
    required: false
    default: false
    hint: No specific manufacturer/model, e.g. "7-inch Monitor"
  - label: Search Aliases
    name: search_aliases
    widget: list
    required: false
    hint: Alternate search terms, e.g. A35, Alexa35
  - label: Notes
    name: notes
    widget: text
    required: false
  - label: Image URL
    name: image_url
    widget: string
    required: false
    hint: Only freely licensed sources, e.g. Wikimedia Commons
  - label: Source / datasheet
    name: source_url
    widget: string
    required: false
