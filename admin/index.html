<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filmequip DB – Admin</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    margin-left: 12px;
  }
  header nav a:hover { color: var(--text); }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px;
  }
  main > p { color: var(--text-dim); font-size: 12px; margin: 0 0 18px; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px;
  }
  .cat-link {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 12px;
    border-radius: 6px;
    text-decoration: none;
    color: var(--text);
    font-size: 13px;
    font-weight: 500;
  }
  .cat-link:hover { background: var(--panel-2); }
  .cat-link + .cat-link { border-top: 1px solid var(--border); }
  .cat-link .arrow { color: var(--text-dim); font-size: 12px; }
</style>
</head>
<body>

<header>
  <h1>Filmequip DB — Admin</h1>
  <nav>
    <a href="../">Browse</a>
    <a href="../manage/">Structure Manager</a>
  </nav>
</header>

<main>
  <p>Each top-level category has its own Decap CMS instance.</p>
  <div class="panel">
    <a class="cat-link" href="camera/"><span>Camera</span><span class="arrow">&rarr;</span></a>
    <a class="cat-link" href="grip/"><span>Grip</span><span class="arrow">&rarr;</span></a>
    <a class="cat-link" href="lighting/"><span>Lighting</span><span class="arrow">&rarr;</span></a>
    <a class="cat-link" href="sound/"><span>Sound</span><span class="arrow">&rarr;</span></a>
    <a class="cat-link" href="miscellaneous/"><span>Miscellaneous</span><span class="arrow">&rarr;</span></a>
  </div>
</main>

</body>
</html>
