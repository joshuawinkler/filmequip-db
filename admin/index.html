<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Filmequip DB – Admin</title>
  <style>
    :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
      --radius: 8px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header nav a { color: var(--text-dim); text-decoration: none; font-size: 12px; }
    header nav a:hover { color: var(--text); }
    main { max-width: 640px; margin: 0 auto; padding: 28px; }
    .card {
      display: block;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-bottom: 14px;
      color: var(--text);
      text-decoration: none;
    }
    .card:hover { border-color: var(--accent); }
    .card h2 { font-size: 14px; margin: 0; }
    .card .desc { color: var(--text-dim); font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>

<header>
  <h1>Filmequip DB — Admin</h1>
  <nav><a href="../manage/">Structure manager</a></nav>
</header>

<main>
  <a class="card" href="camera/">
    <h2>Camera</h2>
    <div class="desc">data/camera/</div>
  </a>
  <a class="card" href="grip/">
    <h2>Grip</h2>
    <div class="desc">data/grip/</div>
  </a>
  <a class="card" href="lighting/">
    <h2>Lighting</h2>
    <div class="desc">data/lighting/</div>
  </a>
  <a class="card" href="sound/">
    <h2>Sound</h2>
    <div class="desc">data/sound/</div>
  </a>
  <a class="card" href="miscellaneous/">
    <h2>Miscellaneous</h2>
    <div class="desc">data/miscellaneous/</div>
  </a>
</main>

</body>
</html>
