    - B-Mount
    - NP-FZ100
    - BP-U
    - NP-F570
    - Custom
    - DJI TB50
    - NP-W235
    - EN-EL15
    - DMW-BLJ31E
  - label: Internal ND Filters
    name: internal_nd_filters
    required: false
    widget: select
    multiple: true
    options:
    - '0.3'
    - '0.6'
    - '0.9'
    - '1.2'
    - '1.5'
    - '1.8'
    - '2.1'
    - '2.4'
    - Vario
    - none
    - '2.7'
  - label: Media Types
    name: media_types
    required: false
    widget: select
    multiple: true
    options:
    - Compact Drive
    - CFexpress Type B
    - USB-C SSD
    - CFast 2.0
    - SXR Capture Drive
