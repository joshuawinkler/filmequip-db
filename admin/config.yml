    - EI 6400
    - EI 12800
    - EI 51200
    - EI 25600
  - label: Power Consumption
    name: power_consumption
    required: false
    widget: string
  - label: Battery Mount
    name: battery_mount
    required: false
    widget: select
    multiple: true
    options:
    - V-Mount
