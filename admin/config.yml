# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Auto-generated by scripts/import_categories.py from data/categories.json and
# data/schemas/fields/*.json - do not hand-edit the `collections:` section,
# re-run the import script instead (it takes the same source CSVs each time).

backend:
  name: github
  repo: joshuawinkler/filmequip-db
  branch: main
  base_url: https://decap-proxy.joshuawinkler.workers.dev
  auth_endpoint: auth

# Opens a PR for every change instead of writing directly to main.
# This preserves the CI validation + review requirement.
publish_mode: editorial_workflow

media_folder: "" # no image upload — images are only linked via image_url (see CONTRIBUTING.md)

collections:
- name: camera-cameras-digital-cameras
  label: CAMERA › Cameras › Digital Cameras
  folder: data/camera/cameras/digital-cameras
  create: true
  slug: '{{id}}'
  identifier_field: id
  extension: yaml
  format: yaml
  summary: '{{manufacturer}} {{model}}'
  fields:
  - label: ID
    name: id
    widget: string
    hint: 'Format: manufacturer-model-slug, e.g. arri-alexa-mini-lf'
  - label: Manufacturer
    name: manufacturer
    widget: string
  - label: Model
    name: model
    widget: string
  - label: Lens Mounts
    name: lens_mounts
    required: false
    widget: select
    multiple: true
    options: &id001
    - Arri LPL
    - Arri PL
    - Canon EF
    - Leica L
    - Sony E
    - Nikon Z
    - Fuji X
    - M4/3
    - Canon RF
    - Fuji G
    - Leica M
    - Leica R
    - Canon FD
    - B4
    - Panavision PV
    - Arri Standard
    - Arri B
    - Arri Maxi PL
    - Arri XPL
    - Aaton
    - Panavision SP70
    - Nikon F
    - Hasselblad HC
    - DJI DL
    - DJI DX
    - Panavision PV65
    - Sony FZ
    - C Mount
  - label: Sensor Size
    name: sensor_size
    required: false
    widget: string
  - label: Sensor Coverage
    name: sensor_coverage
    required: false
    widget: select
    options:
    - Super 35
    - Large Format
    - Full Frame
    - 65mm
    - APS-C
    - Micro Four Thirds
    - 16mm
    - Super 16
  - label: Release
    name: release
    required: false
    widget: number
    value_type: float
  - label: Resolution
    name: resolution
    required: false
    widget: string
  - label: Min FPS
    name: min_fps
    required: false
    widget: number
    value_type: float
  - label: Max Resolution
    name: max_resolution
    required: false
    widget: string
  - label: Max FPS
    name: max_fps
    required: false
    widget: number
    value_type: float
  - label: Sensor Diagonal mm
    name: sensor_diagonal_mm
    required: false
    widget: number
    value_type: float
  - label: Shutter Range
    name: shutter_range
    required: false
    widget: string
  - label: Dynamic Range
    name: dynamic_range
    required: false
    widget: string
  - label: Weight
    name: weight
    required: false
    widget: string
  - label: Shutter Type
    name: shutter_type
    required: false
    widget: select
    options:
    - Rolling Shutter
    - Global Shutter
  - label: Base Sensitivity
    name: base_sensitivity
    required: false
    widget: select
    multiple: true
    options:
    - EI 100
    - EI 125
    - EI 320
    - EI 400
    - EI 500
    - EI 640
    - EI 800
    - EI 1250
    - EI 1600
    - EI 2500
    - EI 3200
    - EI 4000
    - EI 5000
    - EI 6400
    - EI 12800
    - EI 160
    - EI 25600
    - EI 51200
    - EI 200
