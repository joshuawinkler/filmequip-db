    - DXL Mag SSD
    - RED Mini Mag SSD
    - REDMag SSD
    - CFexpress Type A
  - label: Codecs
    name: codecs
    required: false
    widget: select
    multiple: true
    options:
    - ARRIRAW
    - ProRes 4444 XQ
    - ProRes 4444
    - ProRes 422 HQ
    - ProRes 422
    - ProRes 422 LT
    - H.264
    - H.264 Proxy
    - H.265
    - Blackmagic RAW
    - ProRes RAW
    - R3D NE
    - N-RAW
    - DNxHD
    - DNxHR
    - R3D RAW
    - ProRes
  - label: Interfaces
    name: interfaces
    required: false
    widget: list
    fields:
    - label: Name
      name: name
      widget: select
      options:
      - HDMI
      - 12G SDI (BNC)
      - BNC
      - RS/24V (Fischer 3-pin)
      - 12V (LEMO 2-pin)
      - LBUS (LEMO 4-pin)
      - AUDIO (LEMO 6-pin)
      - ETH (LEMO 10-pin)
      - Arri MVF (custom CoaXPress)
      - PWR (LEMO 8-pin)
      - SERIAL (LEMO 4-pin)
      - TC (LEMO 5-pin)
      - Headphone (3.5 mm stereo jack)
      - Mic (3.5mm stereo jack)
      - USB-C
      - Mini XLR
      - 12V Locking Connector (WEIPU SF6)
    - label: Amount
      name: amount
      widget: number
      value_type: int
  - label: Autofocus
    name: autofocus
    required: false
    widget: boolean
    default: false
  - label: Notes
    name: notes
    widget: text
    required: false
  - label: Image URL
    name: image_url
    widget: string
    required: false
    hint: Only freely licensed sources, e.g. Wikimedia Commons
  - label: Source / datasheet
    name: source_url
    widget: string
    required: false
