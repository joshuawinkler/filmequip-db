# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/

backend:
  name: github
  repo: joshuawinkler/filmequip-db
  branch: main
  base_url: https://decap-proxy.joshuawinkler.workers.dev
  auth_endpoint: auth

# Opens a PR for every change instead of writing directly to main.
# This preserves the CI validation + review requirement.
publish_mode: editorial_workflow

media_folder: "" # no image upload — images are only linked via image_url (see CONTRIBUTING.md)

collections:
  - name: "camera"
    label: "Camera"
    folder: "data/camera"
    create: true
    slug: "{{id}}"
    identifier_field: id
    extension: "yaml"
    format: "yaml"
    summary: "{{manufacturer}} {{model}}"
    fields:
      - { label: "ID", name: "id", widget: "string", hint: "Format: manufacturer-model-slug, e.g. arri-alexa-mini-lf" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["Digital Cameras", "Film Cameras"]
      - { label: "Manufacturer", name: "manufacturer", widget: "string" }
      - { label: "Model", name: "model", widget: "string" }
      - label: "Type"
        name: "type"
        widget: "select"
        options: ["digital", "film"]
      - { label: "Mount", name: "mount", widget: "string", required: false }
      - label: "Sensor"
        name: "sensor"
        widget: "object"
        required: false
        fields:
          - { label: "Size", name: "size", widget: "string", required: false }
          - { label: "Resolution", name: "resolution", widget: "string", required: false }
          - { label: "Type", name: "type", widget: "string", required: false }
      - { label: "Weight (kg)", name: "weight_kg", widget: "number", required: false, value_type: "float" }
      - { label: "Release year", name: "release_year", widget: "number", required: false, value_type: "int" }
      - { label: "Notes", name: "notes", widget: "text", required: false }
      - { label: "Image URL", name: "image_url", widget: "string", required: false, hint: "Only freely licensed sources, e.g. Wikimedia Commons" }
      - { label: "Source / datasheet", name: "source_url", widget: "string" }

  - name: "lighting"
    label: "Lighting"
    folder: "data/lighting"
    create: true
    slug: "{{id}}"
    identifier_field: id
    extension: "yaml"
    format: "yaml"
    summary: "{{manufacturer}} {{model}}"
    fields:
      - { label: "ID", name: "id", widget: "string", hint: "Format: manufacturer-model-slug, e.g. aputure-600d-pro" }
      - label: "Category"
        name: "category"
        widget: "select"
        options: ["LED", "HMI", "Tungsten", "Fluorescent", "Moving Lights & Effects", "Underwater Lighting", "Outdoor Systems", "Balloons"]
      - { label: "Manufacturer", name: "manufacturer", widget: "string" }
      - { label: "Model", name: "model", widget: "string" }
      - { label: "Power (watts)", name: "power_watts", widget: "number", required: false, value_type: "float" }
      - { label: "Color temperature (Kelvin)", name: "color_temp_kelvin", widget: "string", required: false, hint: "e.g. 2700-6500 or 5600" }
      - { label: "Weight (kg)", name: "weight_kg", widget: "number", required: false, value_type: "float" }
      - label: "Power source"
        name: "power_source"
        widget: "select"
        multiple: true
        required: false
        options: ["mains", "battery", "both"]
      - { label: "Release year", name: "release_year", widget: "number", required: false, value_type: "int" }
      - { label: "Notes", name: "notes", widget: "text", required: false }
      - { label: "Image URL", name: "image_url", widget: "string", required: false, hint: "Only freely licensed sources, e.g. Wikimedia Commons" }
      - { label: "Source / datasheet", name: "source_url", widget: "string" }
