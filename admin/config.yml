    required: false
    widget: select
    options:
    - EI 100
    - EI 125
    - EI 320
    - EI 400
    - EI 500
    - EI 640
    - EI 800
    - EI 160
    - EI 250
  - label: Max Sensitivity
    name: max_sensitivity
    required: false
