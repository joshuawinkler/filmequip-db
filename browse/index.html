<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filmequip DB — Browse</title>
<meta name="description" content="An open, collaboratively curated database of film equipment — browse, search and filter cameras, grip, lighting, sound and more." />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
    --danger: #e5636b;
    --ok: #4fbf7a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  a { color: var(--accent); }

  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--text-dim); font-weight: 400; }
  header nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    margin-left: 14px;
  }
  header nav a:hover { color: var(--text); }

  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.ghost { background: transparent; color: var(--text-dim); border: none; padding: 2px 6px; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  input, select {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
    width: 100%;
    font-family: inherit;
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }

  .hidden { display: none !important; }
  .center { text-align: center; padding: 80px 20px; color: var(--text-dim); }

  #app { display: grid; grid-template-columns: 280px 1fr; height: calc(100vh - 49px); }

  /* ---------- Sidebar ---------- */
  #treePane {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #treeSearch { margin: 10px; width: calc(100% - 20px); }
  #tree { flex: 1; overflow-y: auto; padding: 0 6px 10px; }

  .node { user-select: none; }
  .node-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 5px 6px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .node-row:hover { background: var(--panel-2); }
  .node-row.selected { background: var(--accent); color: white; }
  .node-row.selected .count { color: rgba(255,255,255,0.75); }
  .node-row .twisty {
    width: 14px; flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 10px;
    text-align: center;
  }
  .node-row .name { overflow: hidden; text-overflow: ellipsis; }
  .node-row .count { font-size: 10px; color: var(--text-dim); margin-left: auto; padding-left: 6px; flex: 0 0 auto; }
  .children { margin-left: 16px; }

  /* ---------- Main pane ---------- */
  #mainPane { overflow-y: auto; padding: 18px 24px 40px; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
  .toolbar #searchBox { flex: 1 1 260px; }
  .toolbar select { flex: 0 0 auto; width: auto; min-width: 140px; }

  .breadcrumb-bar { display: flex; align-items: center; gap: 8px; margin: 14px 0 6px; flex-wrap: wrap; }
  .breadcrumb-bar h2 { font-size: 18px; margin: 0; }
  .result-count { color: var(--text-dim); font-size: 12px; }

  #filtersToggle { position: relative; }
  #filtersToggle .badge {
    display: inline-block; background: var(--accent); color: white;
    border-radius: 999px; font-size: 10px; line-height: 1; padding: 2px 5px; margin-left: 6px;
  }

  /* compact strip shown when the panel is closed but filters are active */
  .active-filters-strip {
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
    margin: 8px 0 4px;
  }
  .active-filters-strip .chip { padding: 2px 8px 2px 10px; }
  .active-filters-strip .chip .x { opacity: 0.7; margin-left: 2px; }

  .facets-panel {
    margin: 8px 0 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-height: 300px;
    overflow-y: auto;
  }
  .facets-panel.hidden { display: none; }
  .facets {
    display: flex; flex-wrap: wrap; gap: 10px 20px;
    padding: 10px 14px;
  }
  .facets-panel-footer {
    position: sticky; bottom: 0;
    display: flex; justify-content: flex-end;
    padding: 6px 12px; border-top: 1px solid var(--border);
    background: var(--panel);
  }
  .facet-group { min-width: 0; max-width: 260px; }
  .facet-group h4 { margin: 0 0 5px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); font-weight: 500; }
  .facet-options { display: flex; flex-wrap: wrap; gap: 4px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    cursor: pointer;
    color: var(--text-dim);
    white-space: nowrap;
  }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: white; }
  .chip.more { background: none; border-style: dashed; }
  .chip .n { opacity: 0.7; font-size: 10px; }
  .chip.active .n { opacity: 0.85; }
  .clear-filters { font-size: 11px; color: var(--accent); background: none; border: none; cursor: pointer; padding: 0; }

  /* ---------- Grid ---------- */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.1s;
  }
  .card:hover { border-color: var(--accent); }
  .card .thumb {
    width: 100%;
    height: 110px;
    border-radius: 6px;
    background: var(--panel-2);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    color: var(--text-dim);
    font-size: 22px;
  }
  .card .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .card .mfr { color: var(--text-dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.02em; }
  .card .model { font-size: 13px; font-weight: 600; }
  .card .cat { color: var(--text-dim); font-size: 10.5px; }
  .card .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: auto; }
  .tag { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; color: var(--text-dim); }

  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }

  /* ---------- Detail modal ---------- */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 200;
  }
  #modal {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    max-width: 640px;
    width: 100%;
    padding: 22px 26px 26px;
  }
  #modal .modal-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  #modal .breadcrumb { color: var(--text-dim); font-size: 11px; margin-bottom: 6px; }
  #modal h2 { font-size: 19px; margin: 0 0 2px; }
  #modal .mfr-line { color: var(--text-dim); font-size: 12px; margin-bottom: 14px; }
  #modal .thumb-lg { width: 100%; max-height: 260px; border-radius: 6px; background: var(--panel-2); display: flex; align-items: center; justify-content: center; overflow: hidden; margin-bottom: 16px; }
  #modal .thumb-lg img { max-width: 100%; max-height: 260px; object-fit: contain; }
  #modal table { width: 100%; border-collapse: collapse; }
  #modal td { padding: 6px 0; border-top: 1px solid var(--border); font-size: 12px; vertical-align: top; }
  #modal td.k { color: var(--text-dim); width: 42%; padding-right: 12px; }
  #modal .notes { margin-top: 16px; font-size: 12.5px; color: var(--text); white-space: pre-wrap; }
  #modal .links { margin-top: 16px; display: flex; gap: 14px; font-size: 12px; }
  #modal .close-btn { flex: 0 0 auto; }

  footer { padding: 24px; text-align: center; color: var(--text-dim); font-size: 11px; }

  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; height: auto; }
    #treePane { border-right: none; border-bottom: 1px solid var(--border); max-height: 260px; }
    #mainPane { padding: 14px 14px 40px; }
  }
</style>
</head>
<body>

<header>
  <h1>Filmequip DB <span id="itemCountHeader"></span></h1>
  <nav>
    <a href="https://github.com/joshuawinkler/filmequip-db" target="_blank" rel="noopener">GitHub</a>
    <a href="v1/all.json" target="_blank" rel="noopener">API</a>
    <a href="admin/">Contribute</a>
    <a href="manage/">Structure Manager</a>
  </nav>
</header>

<div id="app">
  <div id="treePane">
    <input id="treeSearch" placeholder="Search categories…" oninput="renderTree()" />
    <div id="tree"></div>
  </div>
  <div id="mainPane">
    <div id="loading" class="center">Loading database…</div>
    <div id="content" class="hidden">
      <div class="toolbar">
        <input id="searchBox" placeholder="Search manufacturer, name, notes…" oninput="onSearchInput()" />
        <button id="filtersToggle" class="secondary" onclick="toggleFiltersPanel()">Filters<span id="filtersBadge"></span></button>
        <select id="sortSelect" onchange="render()">
          <option value="name">Sort: Name A–Z</option>
          <option value="mfr">Sort: Manufacturer A–Z</option>
          <option value="cat">Sort: Category</option>
        </select>
      </div>
      <div id="activeFiltersStrip" class="active-filters-strip"></div>
      <div class="breadcrumb-bar">
        <h2 id="scopeTitle">All equipment</h2>
        <span class="result-count" id="resultCount"></span>
      </div>
      <div id="facetsPanel" class="facets-panel hidden">
        <div id="facets" class="facets"></div>
      </div>
      <div id="grid"></div>
      <div id="emptyState" class="empty-state hidden">No items match your search/filters.</div>
    </div>
  </div>
</div>

<div id="modalOverlay" class="hidden" onclick="if(event.target===this) closeModal()">
  <div id="modal"></div>
</div>

<footer>
  Data licensed <a href="https://opendatacommons.org/licenses/odbl/" target="_blank" rel="noopener">ODbL</a> ·
  <a href="admin/">Add or edit an entry</a>
</footer>

<script>
let categories = [];      // [{id,name,parent_id,sort_order,slug}]
let fieldSchemas = {};    // category_id -> {category_id, category_name, fields:[...]}
let fieldDefsByKey = {};  // field key -> field def (label, type, options, sort_order, variant)
let allItems = [];        // flattened items, each with category_id + category breadcrumb

let selectedCategoryId = null; // null = all
let searchQuery = "";
let activeFilters = {}; // fieldKey -> Set(values)
let expanded = new Set();
let filtersOpen = false;
let expandedFacetGroups = new Set(); // field keys where "+N more" has been clicked

const NON_FIELD_KEYS = new Set(["id", "category", "category_id", "manufacturer", "name", "generic", "search_aliases", "notes", "image_url", "source_url"]);
const FACET_GROUP_PREVIEW_COUNT = 8;

// ---------- Load ----------
async function loadState() {
  try {
    const [cats, fields, items] = await Promise.all([
      fetch("v1/categories.json").then(r => r.json()),
      fetch("v1/fields.json").then(r => r.json()),
      fetch("v1/all.json").then(r => r.json()),
    ]);
    categories = cats;
    fieldSchemas = fields;
    allItems = items;

    fieldDefsByKey = {};
    Object.values(fieldSchemas).forEach(schema => {
      (schema.fields || []).forEach(f => {
        if (!(f.key in fieldDefsByKey)) fieldDefsByKey[f.key] = f;
      });
    });

    document.getElementById("itemCountHeader").textContent = `— ${allItems.length} items`;
    document.getElementById("loading").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");

    // expand roots by default
    rootsOf().forEach(r => expanded.add(r.id));
    renderTree();
    render();
  } catch (err) {
    document.getElementById("loading").innerHTML =
      `Could not load the database. <br><span style="font-size:11px;">${escapeHtml(err.message)}</span>`;
  }
}

// ---------- Category tree helpers ----------
function byId(id) { return categories.find(n => n.id === id); }
function childrenOf(id) { return categories.filter(n => n.parent_id === id).sort((a, b) => a.sort_order - b.sort_order); }
function ancestorsOf(id) { const chain = []; let cur = id; while (cur) { chain.push(cur); cur = byId(cur).parent_id; } return chain; }
function chainRootToNode(id) { return ancestorsOf(id).reverse(); }
function rootsOf() { return categories.filter(n => n.parent_id === null).sort((a, b) => a.sort_order - b.sort_order); }
function descendantIdsOf(id) {
  const out = [id];
  childrenOf(id).forEach(c => out.push(...descendantIdsOf(c.id)));
  return out;
}
function itemCountFor(id) {
  const scope = new Set(descendantIdsOf(id));
  return allItems.reduce((n, it) => n + (scope.has(it.category_id) ? 1 : 0), 0);
}

function escapeHtml(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// ---------- Tree rendering ----------
function renderTree() {
  const q = document.getElementById("treeSearch").value.trim().toLowerCase();
  const matchIds = q ? new Set(categories.filter(n => n.name.toLowerCase().includes(q)).map(n => n.id)) : null;
  if (matchIds) matchIds.forEach(id => ancestorsOf(id).forEach(a => expanded.add(a)));

  function visible(id) {
    if (!matchIds) return true;
    if (matchIds.has(id)) return true;
    return childrenOf(id).some(c => visible(c.id));
  }

  function renderNode(node, depth) {
    const kids = childrenOf(node.id).filter(c => visible(c.id));
    const hasKids = childrenOf(node.id).length > 0;
    const isOpen = expanded.has(node.id);
    const count = itemCountFor(node.id);
    const el = document.createElement("div");
    el.className = "node";
    const row = document.createElement("div");
    row.className = "node-row" + (node.id === selectedCategoryId ? " selected" : "");
    row.innerHTML = `
      <span class="twisty">${hasKids ? (isOpen ? "▾" : "▸") : ""}</span>
      <span class="name">${escapeHtml(depth === 0 ? node.name.toUpperCase() : node.name)}</span>
      <span class="count">${count}</span>
    `;
    row.onclick = (e) => {
      if (e.target.classList.contains("twisty") && hasKids) {
        expanded.has(node.id) ? expanded.delete(node.id) : expanded.add(node.id);
        renderTree();
        return;
      }
      selectedCategoryId = (selectedCategoryId === node.id) ? null : node.id;
      activeFilters = {};
      renderTree();
      render();
    };
    el.appendChild(row);
    if (hasKids && isOpen) {
      const kidsWrap = document.createElement("div");
      kidsWrap.className = "children";
      kids.forEach(k => kidsWrap.appendChild(renderNode(k, depth + 1)));
      el.appendChild(kidsWrap);
    }
    return el;
  }

  const container = document.getElementById("tree");
  container.innerHTML = "";
  const allRow = document.createElement("div");
  allRow.className = "node-row" + (selectedCategoryId === null ? " selected" : "");
  allRow.innerHTML = `<span class="twisty"></span><span class="name">ALL EQUIPMENT</span><span class="count">${allItems.length}</span>`;
  allRow.onclick = () => { selectedCategoryId = null; activeFilters = {}; renderTree(); render(); };
  container.appendChild(allRow);
  rootsOf().filter(r => visible(r.id)).forEach(r => container.appendChild(renderNode(r, 0)));
}

// ---------- Filtering / search ----------
let searchDebounce = null;
function onSearchInput() {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => {
    searchQuery = document.getElementById("searchBox").value.trim().toLowerCase();
    render();
  }, 120);
}

function matchesSearch(item) {
  if (!searchQuery) return true;
  const hay = [item.manufacturer, item.name, item.notes, item.category, ...(item.search_aliases || [])]
    .filter(Boolean).join(" ").toLowerCase();
  return hay.includes(searchQuery);
}

function inScope(item) {
  if (selectedCategoryId === null) return true;
  return descendantIdsOf(selectedCategoryId).includes(item.category_id);
}

function fieldValueList(item, key) {
  const v = item[key];
  if (v === undefined || v === null) return [];
  if (Array.isArray(v)) {
    // multiselect (strings) or multiselect_amounts (objects with .name)
    return v.map(x => (typeof x === "object" && x !== null) ? x.name : x);
  }
  return [String(v)];
}

function matchesFilters(item, excludeKey) {
  for (const [key, values] of Object.entries(activeFilters)) {
    if (key === excludeKey || values.size === 0) continue;
    const itemValues = fieldValueList(item, key);
    if (!itemValues.some(v => values.has(String(v)))) return false;
  }
  return true;
}

function baseFilteredItems() {
  return allItems.filter(it => inScope(it) && matchesSearch(it));
}

function finalFilteredItems() {
  return baseFilteredItems().filter(it => matchesFilters(it, null));
}

// ---------- Facets ----------
function computeFacets() {
  const base = baseFilteredItems();
  const facetKeys = new Set();
  base.forEach(it => {
    Object.keys(it).forEach(k => {
      if (NON_FIELD_KEYS.has(k)) return;
      const def = fieldDefsByKey[k];
      if (def && def.filterable) facetKeys.add(k);
    });
  });

  const facets = [];
  facetKeys.forEach(key => {
    const def = fieldDefsByKey[key];
    const scoped = base.filter(it => matchesFilters(it, key));
    const counts = new Map();
    scoped.forEach(it => {
      fieldValueList(it, key).forEach(v => counts.set(v, (counts.get(v) || 0) + 1));
    });
    if (counts.size < 2) return; // not worth showing as a filter
    const options = (def.options && def.options.length ? def.options : [...counts.keys()])
      .filter(o => counts.has(o))
      .map(o => ({ value: o, count: counts.get(o) }));
    if (def.type === "boolean") return; // booleans handled inline below
    facets.push({ key, label: def.label, options });
  });

  // boolean facets: show as a single "Yes" toggle chip
  facetKeys.forEach(key => {
    const def = fieldDefsByKey[key];
    if (def.type !== "boolean") return;
    const scoped = base.filter(it => matchesFilters(it, key));
    const yesCount = scoped.filter(it => it[key] === true).length;
    if (yesCount === 0 || yesCount === scoped.length) return;
    facets.push({ key, label: def.label, options: [{ value: "true", count: yesCount }] });
  });

  facets.sort((a, b) => a.label.localeCompare(b.label));
  return facets;
}

function toggleFilter(key, value) {
  if (!activeFilters[key]) activeFilters[key] = new Set();
  if (activeFilters[key].has(value)) activeFilters[key].delete(value);
  else activeFilters[key].add(value);
  if (activeFilters[key].size === 0) delete activeFilters[key];
  render();
}

function clearFilters() { activeFilters = {}; render(); }

function toggleFiltersPanel() { filtersOpen = !filtersOpen; render(); }

function toggleFacetGroupExpanded(key) {
  expandedFacetGroups.has(key) ? expandedFacetGroups.delete(key) : expandedFacetGroups.add(key);
  render();
}

function activeFilterCount() {
  return Object.values(activeFilters).reduce((n, set) => n + set.size, 0);
}

function facetLabelFor(key, value) {
  return fieldDefsByKey[key] && fieldDefsByKey[key].type === "boolean" ? "Yes" : value;
}

// Compact one-line strip of currently active filters, always visible
// (even with the full panel collapsed) so filtering state is never hidden.
function renderActiveFiltersStrip() {
  const host = document.getElementById("activeFiltersStrip");
  const entries = [];
  Object.entries(activeFilters).forEach(([key, values]) => {
    values.forEach(v => entries.push({ key, value: v }));
  });
  if (entries.length === 0) { host.innerHTML = ""; return; }
  host.innerHTML = entries.map(({ key, value }) => `
    <span class="chip active" data-key="${escapeHtml(key)}" data-value="${escapeHtml(value)}">
      ${escapeHtml(fieldDefsByKey[key] ? fieldDefsByKey[key].label : key)}: ${escapeHtml(facetLabelFor(key, value))}
      <span class="x">✕</span>
    </span>
  `).join("") + `<button class="clear-filters" onclick="clearFilters()">Clear all</button>`;
  host.querySelectorAll(".chip").forEach(el => {
    el.onclick = () => toggleFilter(el.dataset.key, el.dataset.value);
  });
}

function renderFacets() {
  const panel = document.getElementById("facetsPanel");
  const badge = document.getElementById("filtersBadge");
  const count = activeFilterCount();
  badge.innerHTML = count ? `<span class="badge">${count}</span>` : "";

  renderActiveFiltersStrip();

  if (!filtersOpen) {
    panel.classList.add("hidden");
    return;
  }
  panel.classList.remove("hidden");

  const host = document.getElementById("facets");
  const facets = computeFacets();
  if (facets.length === 0) {
    host.innerHTML = `<div style="color:var(--text-dim); padding:6px 2px;">No filterable specs for this selection.</div>`;
    return;
  }

  host.innerHTML = facets.map(f => {
    const isExpanded = expandedFacetGroups.has(f.key);
    const visibleOptions = isExpanded ? f.options : f.options.slice(0, FACET_GROUP_PREVIEW_COUNT);
    const hiddenCount = f.options.length - visibleOptions.length;
    return `
    <div class="facet-group">
      <h4>${escapeHtml(f.label)}</h4>
      <div class="facet-options">
        ${visibleOptions.map(o => {
          const active = activeFilters[f.key] && activeFilters[f.key].has(String(o.value));
          return `<span class="chip${active ? " active" : ""}" data-key="${escapeHtml(f.key)}" data-value="${escapeHtml(String(o.value))}">${escapeHtml(facetLabelFor(f.key, o.value))} <span class="n">${o.count}</span></span>`;
        }).join("")}
        ${hiddenCount > 0 ? `<span class="chip more" data-expand-key="${escapeHtml(f.key)}">+${hiddenCount} more</span>` : ""}
        ${isExpanded && f.options.length > FACET_GROUP_PREVIEW_COUNT ? `<span class="chip more" data-expand-key="${escapeHtml(f.key)}">Show less</span>` : ""}
      </div>
    </div>
  `;
  }).join("");

  host.querySelectorAll(".chip[data-key]").forEach(el => {
    el.onclick = () => toggleFilter(el.dataset.key, el.dataset.value);
  });
  host.querySelectorAll(".chip[data-expand-key]").forEach(el => {
    el.onclick = () => toggleFacetGroupExpanded(el.dataset.expandKey);
  });
}

// ---------- Grid ----------
function sortItems(items) {
  const mode = document.getElementById("sortSelect").value;
  const copy = [...items];
  if (mode === "mfr") copy.sort((a, b) => (a.manufacturer || "").localeCompare(b.manufacturer || "") || (a.name || "").localeCompare(b.name || ""));
  else if (mode === "cat") copy.sort((a, b) => (a.category || "").localeCompare(b.category || "") || (a.name || "").localeCompare(b.name || ""));
  else copy.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  return copy;
}

function variantTagsFor(item) {
  return Object.keys(item)
    .filter(k => !NON_FIELD_KEYS.has(k) && fieldDefsByKey[k] && fieldDefsByKey[k].variant)
    .flatMap(k => fieldValueList(item, k))
    .slice(0, 4);
}

function renderGrid() {
  const items = sortItems(finalFilteredItems());
  document.getElementById("resultCount").textContent = `${items.length} item${items.length === 1 ? "" : "s"}`;
  document.getElementById("scopeTitle").textContent = selectedCategoryId ? byId(selectedCategoryId).name : "All equipment";

  const grid = document.getElementById("grid");
  const emptyState = document.getElementById("emptyState");
  if (items.length === 0) {
    grid.innerHTML = "";
    emptyState.classList.remove("hidden");
    return;
  }
  emptyState.classList.add("hidden");

  grid.innerHTML = items.map((it, i) => {
    const tags = variantTagsFor(it);
    return `
      <div class="card" data-idx="${i}">
        <div class="thumb">${it.image_url ? `<img loading="lazy" src="${escapeHtml(it.image_url)}" onerror="this.parentElement.innerHTML='🎥'" />` : "🎥"}</div>
        <div class="mfr">${escapeHtml(it.manufacturer || "")}</div>
        <div class="model">${escapeHtml(it.name || it.id || "")}</div>
        <div class="cat">${escapeHtml(it.category || "")}</div>
        ${tags.length ? `<div class="tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}</div>` : ""}
      </div>`;
  }).join("");

  grid.querySelectorAll(".card").forEach(el => {
    el.onclick = () => openModal(items[Number(el.dataset.idx)]);
  });
}

function render() {
  renderFacets();
  renderGrid();
}

// ---------- Detail modal ----------
function formatValue(key, value) {
  const def = fieldDefsByKey[key];
  if (Array.isArray(value)) {
    if (value.length && typeof value[0] === "object" && value[0] !== null) {
      return value.map(v => `<span class="tag">${escapeHtml(v.name)}${v.amount != null ? " ×" + escapeHtml(v.amount) : ""}</span>`).join(" ");
    }
    return value.map(v => `<span class="tag">${escapeHtml(v)}</span>`).join(" ");
  }
  if (typeof value === "boolean") return value ? "Yes" : "No";
  return escapeHtml(String(value));
}

function openModal(item) {
  const keys = Object.keys(item)
    .filter(k => !NON_FIELD_KEYS.has(k) && item[k] !== null && item[k] !== "" && !(Array.isArray(item[k]) && item[k].length === 0))
    .sort((a, b) => {
      const sa = fieldDefsByKey[a] ? fieldDefsByKey[a].sort_order : 999;
      const sb = fieldDefsByKey[b] ? fieldDefsByKey[b].sort_order : 999;
      return sa - sb;
    });

  const rows = keys.map(k => `
    <tr><td class="k">${escapeHtml(fieldDefsByKey[k] ? fieldDefsByKey[k].label : k)}</td><td>${formatValue(k, item[k])}</td></tr>
  `).join("");

  document.getElementById("modal").innerHTML = `
    <div class="modal-top">
      <div>
        <div class="breadcrumb">${escapeHtml(item.category || "")}</div>
        <h2>${escapeHtml(item.name || item.id || "")}</h2>
        <div class="mfr-line">${escapeHtml(item.manufacturer || "")}</div>
      </div>
      <button class="secondary close-btn" onclick="closeModal()">Close</button>
    </div>
    ${item.image_url ? `<div class="thumb-lg"><img src="${escapeHtml(item.image_url)}" onerror="this.parentElement.remove()" /></div>` : ""}
    <table>${rows || `<tr><td colspan="2" style="color:var(--text-dim);">No additional specs recorded yet.</td></tr>`}</table>
    ${item.notes ? `<div class="notes">${escapeHtml(item.notes)}</div>` : ""}
    <div class="links">
      ${item.source_url ? `<a href="${escapeHtml(item.source_url)}" target="_blank" rel="noopener">Source / datasheet →</a>` : ""}
      <a href="admin/" target="_blank" rel="noopener">Suggest an edit →</a>
    </div>
  `;
  document.getElementById("modalOverlay").classList.remove("hidden");
}
function closeModal() { document.getElementById("modalOverlay").classList.add("hidden"); }
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeModal(); });

loadState();
</script>
</body>
