<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="robots" content="noindex" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Filmequip DB – Structure Manager</title>
<script src="https://unpkg.com/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --panel-2: #1e222b;
    --border: #2a2f3a;
    --text: #e7e9ee;
    --text-dim: #9aa1b0;
    --accent: #5b8cff;
    --danger: #e5636b;
    --ok: #4fbf7a;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
    font-size: 13px;
    line-height: 1.5;
  }
  header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; }
  header nav a {
    color: var(--text-dim);
    text-decoration: none;
    font-size: 12px;
    margin-left: 12px;
  }
  header nav a:hover { color: var(--text); }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  button.secondary { background: var(--panel-2); color: var(--text); border: 1px solid var(--border); }
  button.danger { background: transparent; color: var(--danger); border: 1px solid var(--border); }
  button.ghost { background: transparent; color: var(--text-dim); border: none; padding: 2px 6px; }
  button.icon { padding: 3px 7px; line-height: 1; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  input, select, textarea {
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 12px;
    width: 100%;
    font-family: inherit;
  }
  label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px; }
  .field { margin-bottom: 10px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .check { display: flex; align-items: center; gap: 6px; }
  .check input { width: auto; }

  .center { text-align: center; padding: 80px 20px; }
  .hidden { display: none !important; }

  #app { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 49px); }

  #treePane {
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  #treeSearch { margin: 10px; width: calc(100% - 20px); }
  #tree { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  #treePane .add-root { margin: 0 10px 8px; }

  .node { user-select: none; }
  .node-row {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
  }
  .node-row:hover { background: var(--panel-2); }
  .node-row.selected { background: var(--accent); color: white; }
  .node-row.selected .count { color: rgba(255,255,255,0.75); }
  .node-row .twisty {
    width: 14px; flex: 0 0 auto;
    color: var(--text-dim);
    font-size: 10px;
    text-align: center;
  }
  .node-row .name { overflow: hidden; text-overflow: ellipsis; }
  .node-row .count { font-size: 10px; color: var(--text-dim); margin-left: auto; padding-left: 6px; flex: 0 0 auto; }
  .children { margin-left: 16px; }

  #detailPane { overflow-y: auto; padding: 20px 28px; }
  #detailPane .breadcrumb { color: var(--text-dim); font-size: 11px; margin-bottom: 10px; }
  #detailPane .breadcrumb .caps { text-transform: uppercase; }
  #detailPane h2 { font-size: 18px; margin: 0 0 4px; }
  #detailPane .folder { color: var(--text-dim); font-size: 11px; font-family: ui-monospace, monospace; margin-bottom: 18px; }

  .actions-row { display: flex; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-dim); margin: 0 0 12px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 10px; text-transform: uppercase; color: var(--text-dim); padding: 0 8px 6px; font-weight: 500; }
  td { padding: 7px 8px; border-top: 1px solid var(--border); font-size: 12px; vertical-align: middle; }
  tr.inherited td { color: var(--text-dim); }
  td.actions { text-align: right; white-space: nowrap; }
  .tag { display: inline-block; background: var(--panel-2); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 10px; margin: 1px 2px 1px 0; }
  .empty-row td { color: var(--text-dim); text-align: center; padding: 14px 8px; }

  .inline-form {
    background: var(--panel-2);
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 12px;
    margin-top: 10px;
  }
  .inline-form .field:last-child { margin-bottom: 0; }

  .status {
    font-size: 12px;
    padding: 9px 12px;
    border-radius: 6px;
    margin-bottom: 16px;
  }
  .status.ok { background: rgba(79,191,122,0.12); color: var(--ok); }
  .status.err { background: rgba(229,99,107,0.12); color: var(--danger); }
  .status.info { background: rgba(91,140,255,0.12); color: var(--accent); }
  .status a { color: inherit; font-weight: 600; }
</style>
</head>
<body>

<header>
  <h1>Filmequip DB — Structure Manager</h1>
  <nav>
    <a href="../admin/">Content editor</a>
    <span id="authArea"></span>
  </nav>
</header>

<div id="loginScreen" class="center">
  <button onclick="login()">Login with GitHub</button>
</div>

<div id="app" class="hidden">
  <div id="treePane">
    <input id="treeSearch" placeholder="Search categories…" oninput="renderTree()" />
    <button class="secondary add-root" onclick="openAddForm(null)">+ Root category</button>
    <div id="tree"></div>
  </div>
  <div id="detailPane"></div>
</div>

<script>
const OWNER = "joshuawinkler";
const REPO = "filmequip-db";
const BRANCH = "main";
const AUTH_BASE = "https://decap-proxy.joshuawinkler.workers.dev";
const API = "https://api.github.com";
const GITHUB_REPO = `${OWNER}/${REPO}`;
const OAUTH_PROXY_BASE_URL = AUTH_BASE;

let token = null;
let categories = [];       // [{id,name,parent_id,sort_order,slug}]
let fieldSchemas = {};     // category_id -> {fields:[...]}
let existingPaths = new Set(); // every path currently in the repo tree (for gitkeep/emptiness checks)
let selectedId = null;
let expanded = new Set();
let addFormParentId = undefined; // undefined = no form open

// ---------- Auth (Decap-compatible OAuth handshake) ----------
function login() {
  const popup = window.open(`${AUTH_BASE}/auth?provider=github`, "gh-auth", "width=600,height=700");
  function handleMessage(e) {
    if (typeof e.data !== "string") return;
    if (e.data === "authorizing:github") { popup.postMessage("authorizing:github", "*"); return; }
    if (e.data.startsWith("authorization:github:success:")) {
      token = JSON.parse(e.data.replace("authorization:github:success:", "")).token;
      window.removeEventListener("message", handleMessage);
      try { popup.close(); } catch (_) {}
      onLoggedIn();
    } else if (e.data.startsWith("authorization:github:error:")) {
      window.removeEventListener("message", handleMessage);
      try { popup.close(); } catch (_) {}
      showStatus("err", "Login failed.");
    }
  }
  window.addEventListener("message", handleMessage);
}

async function onLoggedIn() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("authArea").innerHTML = '<span style="color:var(--ok); font-size:12px;">● Connected</span>';
  await loadState();
}

function gh(path, opts = {}) {
  return fetch(API + path, {
    ...opts,
    headers: { "Authorization": "token " + token, "Accept": "application/vnd.github+json", ...(opts.headers || {}) },
  });
}
function utf8ToB64(str) { return btoa(unescape(encodeURIComponent(str))); }
function b64ToUtf8(str) { return decodeURIComponent(escape(atob(str))); }

// ---------- Load current structure ----------
async function loadState() {
  showStatus("info", "Loading…");
  try {
    const catRes = await gh(`/repos/${OWNER}/${REPO}/contents/data/categories.json?ref=${BRANCH}`).then(r => r.json());
    categories = JSON.parse(b64ToUtf8(catRes.content));

    const dirRes = await gh(`/repos/${OWNER}/${REPO}/contents/data/schemas/fields?ref=${BRANCH}`).then(r => r.json());
    fieldSchemas = {};
    await Promise.all((Array.isArray(dirRes) ? dirRes : []).map(async (entry) => {
      const fileRes = await gh(`/repos/${OWNER}/${REPO}/contents/${entry.path}?ref=${BRANCH}`).then(r => r.json());
      const parsed = JSON.parse(b64ToUtf8(fileRes.content));
      fieldSchemas[parsed.category_id] = parsed;
    }));

    const refRes = await gh(`/repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}`).then(r => r.json());
    const treeRes = await gh(`/repos/${OWNER}/${REPO}/git/trees/${refRes.object.sha}?recursive=1`).then(r => r.json());
    existingPaths = new Set((treeRes.tree || []).filter(e => e.type === "blob").map(e => e.path));

    if (!categories.some(n => n.id === selectedId)) selectedId = null;
    clearStatus();
    renderTree();
    renderDetail();
  } catch (err) {
    showStatus("err", "Could not load repo contents: " + err.message);
  }
}

function showStatus(kind, html) {
  let box = document.getElementById("globalStatus");
  if (!box) {
    box = document.createElement("div");
    box.id = "globalStatus";
    box.style.cssText = "position:fixed; top:56px; right:20px; z-index:100; max-width:380px;";
    document.body.appendChild(box);
  }
  box.innerHTML = `<div class="status ${kind}">${html}</div>`;
}
function clearStatus() {
  const box = document.getElementById("globalStatus");
  if (box) box.innerHTML = "";
}

// ---------- Tree helpers ----------
function byId(id) { return categories.find(n => n.id === id); }
function childrenOf(id) { return categories.filter(n => n.parent_id === id).sort((a, b) => a.sort_order - b.sort_order); }
function ancestorsOf(id) { const chain = []; let cur = id; while (cur) { chain.push(cur); cur = byId(cur).parent_id; } return chain; }
function chainRootToNode(id) { return ancestorsOf(id).reverse(); }
function isLeaf(id) { return !categories.some(n => n.parent_id === id); }
function rootsOf() { return categories.filter(n => n.parent_id === null).sort((a, b) => a.sort_order - b.sort_order); }

function slugify(name) {
  return name.toLowerCase().trim().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
}
function uniqueSlug(name, parentId) {
  const base = slugify(name);
  const siblingSlugs = new Set(childrenOf(parentId).map(n => n.slug));
  if (!siblingSlugs.has(base)) return base;
  let i = 2;
  while (siblingSlugs.has(`${base}-${i}`)) i++;
  return `${base}-${i}`;
}
function folderPathOf(id) { return chainRootToNode(id).map(cid => byId(cid).slug).join("/"); }
function newId() {
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0, v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// ---------- Tree rendering ----------
function renderTree() {
  const q = document.getElementById("treeSearch").value.trim().toLowerCase();
  const matchIds = q ? new Set(categories.filter(n => n.name.toLowerCase().includes(q)).map(n => n.id)) : null;
  if (matchIds) {
    // auto-expand ancestors of matches
    matchIds.forEach(id => ancestorsOf(id).forEach(a => expanded.add(a)));
  }

  function visible(id) {
    if (!matchIds) return true;
    if (matchIds.has(id)) return true;
    return childrenOf(id).some(c => visible(c.id));
  }

  function renderNode(node, depth) {
    const kids = childrenOf(node.id).filter(c => visible(c.id));
    const hasKids = childrenOf(node.id).length > 0;
    const isOpen = expanded.has(node.id);
    const el = document.createElement("div");
    el.className = "node";
    const row = document.createElement("div");
    row.className = "node-row" + (node.id === selectedId ? " selected" : "");
    row.innerHTML = `
      <span class="twisty">${hasKids ? (isOpen ? "▾" : "▸") : ""}</span>
      <span class="name">${escapeHtml(depth === 0 ? node.name.toUpperCase() : node.name)}</span>
      <span class="count">${fieldSchemas[node.id]?.fields?.length ? fieldSchemas[node.id].fields.length + "f" : ""}</span>
    `;
    row.onclick = (e) => {
      if (e.target.classList.contains("twisty") && hasKids) {
        expanded.has(node.id) ? expanded.delete(node.id) : expanded.add(node.id);
        renderTree();
        return;
      }
      selectedId = node.id;
      renderTree();
      renderDetail();
    };
    el.appendChild(row);
    if (hasKids && isOpen) {
      const kidsWrap = document.createElement("div");
      kidsWrap.className = "children";
      kids.forEach(k => kidsWrap.appendChild(renderNode(k, depth + 1)));
      el.appendChild(kidsWrap);
    }
    return el;
  }

  const container = document.getElementById("tree");
  container.innerHTML = "";
  rootsOf().filter(r => visible(r.id)).forEach(r => container.appendChild(renderNode(r, 0)));
}

// ---------- Detail pane ----------
function renderDetail() {
  const pane = document.getElementById("detailPane");
  if (!selectedId) {
    pane.innerHTML = `<div style="color:var(--text-dim); padding:40px 0;">Select a category, or add a root category.</div>`;
    return;
  }
  const node = byId(selectedId);
  const chain = chainRootToNode(node.id);
  const breadcrumb = chain.map((cid, i) => `<span class="${i === 0 ? "caps" : ""}">${escapeHtml(byId(cid).name)}</span>`).join(" › ");
  const own = fieldSchemas[node.id]?.fields || [];
  const inherited = chain.slice(0, -1).flatMap(cid => fieldSchemas[cid]?.fields || []);
  const kids = childrenOf(node.id);
  const folderHasFiles = [...existingPaths].some(p => p.startsWith(`data/${folderPathOf(node.id)}/`) && p.endsWith(".yaml"));
  const canDelete = kids.length === 0 && !folderHasFiles && chain.length > 1; // never delete a root from here

  pane.innerHTML = `
    <div class="breadcrumb">${breadcrumb}</div>
    <h2>${escapeHtml(node.name)}</h2>
    <div class="folder">data/${folderPathOf(node.id)}/</div>

    <div class="actions-row">
      <button onclick="openAddForm('${node.id}')">+ Subcategory</button>
      <button class="secondary" onclick="moveSibling('${node.id}', -1)">↑ Move up</button>
      <button class="secondary" onclick="moveSibling('${node.id}', 1)">↓ Move down</button>
      <button class="danger" ${canDelete ? "" : "disabled"} onclick="deleteCategory('${node.id}')"
        title="${canDelete ? "" : "Has subcategories or entries — remove those first"}">Delete</button>
    </div>

    <div id="renameForm" class="panel">
      <h3>Name</h3>
      <div class="row">
        <input id="renameInput" value="${escapeAttr(node.name)}" />
        <button class="secondary" style="flex:0 0 auto;" onclick="renameCategory('${node.id}')">Save</button>
      </div>
    </div>

    <div id="addFormHost"></div>

    <div class="panel">
      <h3>Fields on this category</h3>
      <table>
        <thead><tr><th>Label</th><th>Type</th><th>Options</th><th></th><th></th></tr></thead>
        <tbody>
          ${inherited.map(f => `
            <tr class="inherited">
              <td>${escapeHtml(f.label)}</td><td>${f.type}</td>
              <td>${(f.options || []).slice(0, 4).map(o => `<span class="tag">${escapeHtml(o)}</span>`).join("")}${(f.options || []).length > 4 ? "…" : ""}</td>
              <td colspan="2" style="text-align:right;">inherited</td>
            </tr>`).join("")}
          ${own.map((f, i) => `
            <tr>
              <td>${escapeHtml(f.label)}<br><span style="color:var(--text-dim); font-size:10px;">${escapeHtml(f.key)}${f.filterable ? " · filterable" : ""}${f.variant ? " · variant" : ""}</span></td>
              <td>${f.type}</td>
              <td>${(f.options || []).slice(0, 4).map(o => `<span class="tag">${escapeHtml(o)}</span>`).join("")}${(f.options || []).length > 4 ? "…" : ""}</td>
              <td class="actions">
                <button class="ghost icon" onclick="moveField('${node.id}', ${i}, -1)" ${i === 0 ? "disabled" : ""}>↑</button>
                <button class="ghost icon" onclick="moveField('${node.id}', ${i}, 1)" ${i === own.length - 1 ? "disabled" : ""}>↓</button>
              </td>
              <td class="actions">
                <button class="ghost" onclick="editField('${node.id}', '${f.key}')">Edit</button>
                <button class="ghost" style="color:var(--danger);" onclick="deleteField('${node.id}', '${f.key}')">✕</button>
              </td>
            </tr>`).join("")}
          ${inherited.length === 0 && own.length === 0 ? `<tr class="empty-row"><td colspan="5">No fields yet</td></tr>` : ""}
        </tbody>
      </table>
      <div id="fieldFormHost"></div>
      <button class="secondary" style="margin-top:12px;" onclick="openFieldForm('${node.id}')">+ Add field</button>
    </div>
  `;

  if (addFormParentId === node.id) renderAddForm(node.id);
}

function escapeAttr(s) { return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;"); }
function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// ---------- Add category form ----------
function openAddForm(parentId) {
  addFormParentId = parentId;
  if (parentId === null) {
    // root add: render a small overlay-ish form above the tree
    let host = document.getElementById("rootAddHost");
    if (!host) {
      host = document.createElement("div");
      host.id = "rootAddHost";
      document.getElementById("treePane").insertBefore(host, document.getElementById("tree"));
    }
    host.innerHTML = `
      <div class="inline-form" style="margin:0 10px 10px;">
        <div class="field"><label>Root category name</label><input id="newRootName" placeholder="e.g. Sound" /></div>
        <div class="row">
          <button onclick="createCategory(null)">Create</button>
          <button class="secondary" onclick="cancelAddForm()">Cancel</button>
        </div>
      </div>`;
  } else {
    renderDetail();
  }
}
function renderAddForm(parentId) {
  const host = document.getElementById("addFormHost");
  if (!host) return;
  host.innerHTML = `
    <div class="inline-form">
      <div class="field"><label>Subcategory name</label><input id="newChildName" placeholder="e.g. Wireless Mics" /></div>
      <div class="row">
        <button onclick="createCategory('${parentId}')">Create</button>
        <button class="secondary" onclick="cancelAddForm()">Cancel</button>
      </div>
    </div>`;
}
function cancelAddForm() {
  addFormParentId = undefined;
  const rootHost = document.getElementById("rootAddHost");
  if (rootHost) rootHost.remove();
  renderDetail();
}

async function createCategory(parentId) {
  const inputId = parentId === null ? "newRootName" : "newChildName";
  const name = document.getElementById(inputId).value.trim();
  if (!name) { showStatus("err", "Name is required."); return; }

  const id = newId();
  const siblings = childrenOf(parentId);
  const sort_order = siblings.length ? Math.max(...siblings.map(s => s.sort_order)) + 1 : 1;
  const slug = uniqueSlug(name, parentId);
  const newNode = { id, name, parent_id: parentId, sort_order, slug };
  const newCategories = [...categories, newNode];

  const files = {};
  files["data/categories.json"] = JSON.stringify(newCategories, null, 2) + "\n";

  // the parent (if any) is no longer a leaf - drop its now-unneeded .gitkeep, add one for the new node
  const gitkeepAdds = [`data/${folderPathOfWith(newCategories, id)}/.gitkeep`];
  const gitkeepRemoves = [];
  if (parentId) {
    const parentGitkeep = `data/${folderPathOfWith(newCategories, parentId)}/.gitkeep`;
    if (existingPaths.has(parentGitkeep)) gitkeepRemoves.push(parentGitkeep);
  }

  await runMutation({
    title: `Add category: ${name}`,
    categories: newCategories,
    fieldSchemaChanges: {},
    gitkeepAdds,
    gitkeepRemoves,
    regenerateAdminShells: parentId === null,
  });
}

function folderPathOfWith(cats, id) {
  const chain = []; let cur = id;
  while (cur) { const n = cats.find(c => c.id === cur); chain.push(n.slug); cur = n.parent_id; }
  return chain.reverse().join("/");
}

async function renameCategory(id) {
  const name = document.getElementById("renameInput").value.trim();
  if (!name) { showStatus("err", "Name is required."); return; }
  const node = byId(id);
  if (name === node.name) return;
  const newCategories = categories.map(n => n.id === id ? { ...n, name } : n);
  await runMutation({
    title: `Rename category: ${node.name} → ${name}`,
    categories: newCategories,
    fieldSchemaChanges: {},
    regenerateAdminShells: node.parent_id === null,
  });
}

async function moveSibling(id, dir) {
  const node = byId(id);
  const siblings = childrenOf(node.parent_id);
  const idx = siblings.findIndex(s => s.id === id);
  const swapWith = siblings[idx + dir];
  if (!swapWith) return;
  const newCategories = categories.map(n => {
    if (n.id === node.id) return { ...n, sort_order: swapWith.sort_order };
    if (n.id === swapWith.id) return { ...n, sort_order: node.sort_order };
    return n;
  });
  await runMutation({
    title: `Reorder category: ${node.name}`,
    categories: newCategories,
    fieldSchemaChanges: {},
    regenerateAdminShells: false,
  });
}

async function deleteCategory(id) {
  const node = byId(id);
  if (!confirm(`Delete "${node.name}"? This cannot be undone from here.`)) return;
  const newCategories = categories.filter(n => n.id !== id);

  const gitkeepRemoves = [];
  const gitkeepAdds = [];
  const path = `data/${folderPathOf(id)}/.gitkeep`;
  if (existingPaths.has(path)) gitkeepRemoves.push(path);
  // if the parent has no other children left, it becomes a leaf and needs a .gitkeep
  if (node.parent_id) {
    const remainingSiblings = newCategories.filter(n => n.parent_id === node.parent_id);
    if (remainingSiblings.length === 0) {
      gitkeepAdds.push(`data/${folderPathOfWith(newCategories, node.parent_id)}/.gitkeep`);
    }
  }

  const fieldSchemaChanges = {};
  if (fieldSchemas[id]) fieldSchemaChanges[id] = null; // null = delete

  await runMutation({
    title: `Delete category: ${node.name}`,
    categories: newCategories,
    fieldSchemaChanges,
    gitkeepAdds,
    gitkeepRemoves,
    regenerateAdminShells: node.parent_id === null,
  });
}

// ---------- Field forms ----------
function fieldTypeNeedsOptions(t) { return ["select", "multiselect", "multiselect_amounts"].includes(t); }

function openFieldForm(categoryId, existing) {
  const host = document.getElementById("fieldFormHost");
  const f = existing || { key: "", label: "", type: "text", filterable: false, variant: false, variant_color: "", options: [] };
  host.innerHTML = `
    <div class="inline-form">
      <div class="row">
        <div class="field"><label>Label</label><input id="ff_label" value="${escapeAttr(f.label)}" placeholder="e.g. Channel Count" /></div>
        <div class="field"><label>Type</label>
          <select id="ff_type" onchange="document.getElementById('ff_optionsWrap').classList.toggle('hidden', !fieldTypeNeedsOptions(this.value))">
            ${["text", "number", "boolean", "select", "multiselect", "multiselect_amounts"].map(t =>
              `<option value="${t}" ${f.type === t ? "selected" : ""}>${t}</option>`).join("")}
          </select>
        </div>
      </div>
      <div id="ff_optionsWrap" class="field ${fieldTypeNeedsOptions(f.type) ? "" : "hidden"}">
        <label>Options (comma-separated)</label>
        <input id="ff_options" value="${escapeAttr((f.options || []).join(", "))}" placeholder="XLR, TRS, TA3" />
      </div>
      <div class="row">
        <label class="check"><input type="checkbox" id="ff_filterable" ${f.filterable ? "checked" : ""} /> Filterable</label>
        <label class="check"><input type="checkbox" id="ff_variant" ${f.variant ? "checked" : ""} /> Variant</label>
      </div>
      <div class="row">
        <button onclick="saveField('${categoryId}', ${existing ? `'${existing.key}'` : "null"})">Save</button>
        <button class="secondary" onclick="document.getElementById('fieldFormHost').innerHTML=''">Cancel</button>
      </div>
    </div>`;
}
function editField(categoryId, key) {
  const f = fieldSchemas[categoryId].fields.find(x => x.key === key);
  openFieldForm(categoryId, f);
}

async function saveField(categoryId, existingKey) {
  const label = document.getElementById("ff_label").value.trim();
  const type = document.getElementById("ff_type").value;
  const filterable = document.getElementById("ff_filterable").checked;
  const variant = document.getElementById("ff_variant").checked;
  const options = document.getElementById("ff_options").value.split(",").map(s => s.trim()).filter(Boolean);
  if (!label) { showStatus("err", "Label is required."); return; }
  if (fieldTypeNeedsOptions(type) && options.length === 0) { showStatus("err", "At least one option is required for this type."); return; }

  const current = fieldSchemas[categoryId]?.fields || [];
  const key = existingKey || slugify(label).replace(/-/g, "_");
  if (!existingKey && current.some(f => f.key === key)) { showStatus("err", `A field with key "${key}" already exists here.`); return; }

  const newField = { key, label, type, sort_order: existingKey ? current.find(f => f.key === key).sort_order : current.length, filterable, variant };
  if (fieldTypeNeedsOptions(type)) newField.options = options;

  const newFields = existingKey ? current.map(f => f.key === key ? newField : f) : [...current, newField];
  const node = byId(categoryId);

  await runMutation({
    title: `${existingKey ? "Edit" : "Add"} field "${label}" on ${node.name}`,
    categories,
    fieldSchemaChanges: { [categoryId]: { category_id: categoryId, category_name: node.name, fields: newFields } },
    regenerateAdminShells: false,
  });
}

async function deleteField(categoryId, key) {
  const node = byId(categoryId);
  const current = fieldSchemas[categoryId].fields;
  const f = current.find(x => x.key === key);
  if (!confirm(`Delete field "${f.label}"? Any existing entries using it will fail validation until updated.`)) return;
  const newFields = current.filter(x => x.key !== key);
  await runMutation({
    title: `Remove field "${f.label}" from ${node.name}`,
    categories,
    fieldSchemaChanges: { [categoryId]: newFields.length ? { category_id: categoryId, category_name: node.name, fields: newFields } : null },
    regenerateAdminShells: false,
  });
}

async function moveField(categoryId, idx, dir) {
  const fields = fieldSchemas[categoryId].fields.map(f => ({ ...f }));
  const target = idx + dir;
  if (target < 0 || target >= fields.length) return;
  [fields[idx], fields[target]] = [fields[target], fields[idx]];
  fields.forEach((f, i) => f.sort_order = i);
  const node = byId(categoryId);
  await runMutation({
    title: `Reorder fields on ${node.name}`,
    categories,
    fieldSchemaChanges: { [categoryId]: { category_id: categoryId, category_name: node.name, fields } },
    regenerateAdminShells: false,
  });
}

// ---------- Decap admin config generation (mirrors scripts/import_categories.py) ----------
function fieldToDecapWidget(f) {
  const base = { label: f.label, name: f.key, required: false };
  if (f.type === "text") return { ...base, widget: "string" };
  if (f.type === "number") return { ...base, widget: "number", value_type: "float" };
  if (f.type === "boolean") return { ...base, widget: "boolean", default: false };
  if (f.type === "select") return { ...base, widget: "select", options: f.options };
  if (f.type === "multiselect") return { ...base, widget: "select", multiple: true, options: f.options };
  if (f.type === "multiselect_amounts") return {
    ...base, widget: "list",
    fields: [
      { label: "Name", name: "name", widget: "select", options: f.options },
      { label: "Amount", name: "amount", widget: "number", value_type: "int" },
    ],
  };
}

function collectionForNode(id, cats, schemas) {
  const chain = []; let cur = id;
  while (cur) { chain.push(cur); cur = cats.find(c => c.id === cur).parent_id; }
  chain.reverse(); // root -> node

  const own = new Map();
  chain.forEach(cid => (schemas[cid]?.fields || []).forEach(f => { if (!own.has(f.key)) own.set(f.key, f); }));

  const fields = [
    { label: "ID", name: "id", widget: "string", hint: "Format: manufacturer-model-slug, e.g. arri-alexa-mini-lf" },
    { label: "Manufacturer", name: "manufacturer", widget: "string" },
    { label: "Model", name: "model", widget: "string" },
    ...[...own.values()].sort((a, b) => a.sort_order - b.sort_order).map(fieldToDecapWidget),
    { label: "Notes", name: "notes", widget: "text", required: false },
    { label: "Image URL", name: "image_url", widget: "string", required: false, hint: "Only freely licensed sources, e.g. Wikimedia Commons" },
    { label: "Source / datasheet", name: "source_url", widget: "string", required: false },
  ];

  const name = chain.map(cid => cats.find(c => c.id === cid).slug).join("-");
  const labelParts = chain.map(cid => cats.find(c => c.id === cid).name);
  labelParts[0] = labelParts[0].toUpperCase();
  const folder = chain.map(cid => cats.find(c => c.id === cid).slug).join("/");
  return {
    name, label: labelParts.join(" › "), folder: `data/${folder}`,
    create: true, slug: "{{id}}", identifier_field: "id",
    extension: "yaml", format: "yaml", summary: "{{manufacturer}} {{model}}", fields,
  };
}

const DECAP_HEADER = `# Decap CMS configuration
# Docs: https://decapcms.org/docs/configuration-options/
#
# Auto-generated by manage/index.html (or scripts/import_categories.py) from
# data/categories.json and data/schemas/fields/*.json - do not hand-edit the
# \`collections:\` section.

backend:
  name: github
  repo: ${GITHUB_REPO}
  branch: main
  base_url: ${OAUTH_PROXY_BASE_URL}
  auth_endpoint: auth

# Opens a PR for every change instead of writing directly to main.
# This preserves the CI validation + review requirement.
publish_mode: editorial_workflow

media_folder: "" # no image upload — images are only linked via image_url (see CONTRIBUTING.md)

collections:
`;

function buildAdminConfigYaml(rootId, cats, schemas) {
  const members = cats.filter(n => ancestorsOfWith(cats, n.id).includes(rootId));
  members.sort((a, b) => {
    const ka = ancestorsOfWith(cats, a.id).reverse().map(cid => cats.find(c => c.id === cid).sort_order);
    const kb = ancestorsOfWith(cats, b.id).reverse().map(cid => cats.find(c => c.id === cid).sort_order);
    for (let i = 0; i < Math.min(ka.length, kb.length); i++) if (ka[i] !== kb[i]) return ka[i] - kb[i];
    return ka.length - kb.length;
  });
  const collections = members.map(n => collectionForNode(n.id, cats, schemas));
  return DECAP_HEADER + jsyaml.dump(collections, { lineWidth: -1 });
}
function ancestorsOfWith(cats, id) {
  const chain = []; let cur = id;
  while (cur) { chain.push(cur); cur = cats.find(c => c.id === cur).parent_id; }
  return chain;
}

// ---------- Commit + PR ----------
async function runMutation({ title, categories: newCategories, fieldSchemaChanges, gitkeepAdds = [], gitkeepRemoves = [], regenerateAdminShells }) {
  showStatus("info", "Opening PR…");
  try {
    const files = {};
    const deletions = [];

    files["data/categories.json"] = JSON.stringify(newCategories, null, 2) + "\n";

    const newSchemas = { ...fieldSchemas };
    for (const [catId, value] of Object.entries(fieldSchemaChanges)) {
      const path = `data/schemas/fields/${catId}.json`;
      if (value === null) {
        delete newSchemas[catId];
        deletions.push(path);
      } else {
        newSchemas[catId] = value;
        files[path] = JSON.stringify(value, null, 2) + "\n";
      }
    }

    const roots = rootsOfWith(newCategories);
    for (const root of roots) {
      files[`admin/${root.slug}/config.yml`] = buildAdminConfigYaml(root.id, newCategories, newSchemas);
    }
    if (regenerateAdminShells) {
      files["admin/index.html"] = buildAdminIndexHtml(roots);
      for (const root of roots) {
        files[`admin/${root.slug}/index.html`] = buildAdminSiteHtml(root.name, roots, root.id);
      }
    }

    gitkeepAdds.forEach(p => { files[p] = ""; });
    gitkeepRemoves.forEach(p => deletions.push(p));

    const pr = await openPrWithFiles(files, deletions, title);
    showStatus("ok", `Opened <a href="${pr.html_url}" target="_blank">PR #${pr.number}</a>: ${title}`);
    addFormParentId = undefined;
    cancelAddForm();
  } catch (err) {
    showStatus("err", "Failed: " + err.message);
  }
}
function rootsOfWith(cats) { return cats.filter(n => n.parent_id === null).sort((a, b) => a.sort_order - b.sort_order); }

async function openPrWithFiles(filesMap, deletions, title) {
  const mainRef = await gh(`/repos/${OWNER}/${REPO}/git/ref/heads/${BRANCH}`).then(r => r.json());
  const baseSha = mainRef.object.sha;
  const branchName = `manage/${slugify(title)}-${Date.now().toString(36)}`;
  await gh(`/repos/${OWNER}/${REPO}/git/refs`, {
    method: "POST", body: JSON.stringify({ ref: `refs/heads/${branchName}`, sha: baseSha }),
  });

  const baseCommit = await gh(`/repos/${OWNER}/${REPO}/git/commits/${baseSha}`).then(r => r.json());
  const treeEntries = [];
  for (const [path, content] of Object.entries(filesMap)) {
    const blob = await gh(`/repos/${OWNER}/${REPO}/git/blobs`, {
      method: "POST", body: JSON.stringify({ content: utf8ToB64(content), encoding: "base64" }),
    }).then(r => r.json());
    treeEntries.push({ path, mode: "100644", type: "blob", sha: blob.sha });
  }
  for (const path of deletions) {
    treeEntries.push({ path, mode: "100644", type: "blob", sha: null });
  }

  const tree = await gh(`/repos/${OWNER}/${REPO}/git/trees`, {
    method: "POST", body: JSON.stringify({ base_tree: baseCommit.tree.sha, tree: treeEntries }),
  }).then(r => r.json());
  const commit = await gh(`/repos/${OWNER}/${REPO}/git/commits`, {
    method: "POST", body: JSON.stringify({ message: title, tree: tree.sha, parents: [baseSha] }),
  }).then(r => r.json());
  await gh(`/repos/${OWNER}/${REPO}/git/refs/heads/${branchName}`, {
    method: "PATCH", body: JSON.stringify({ sha: commit.sha }),
  });
  return gh(`/repos/${OWNER}/${REPO}/pulls`, {
    method: "POST", body: JSON.stringify({ title, head: branchName, base: BRANCH, body: "" }),
  }).then(r => r.json());
}
